<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="محمد پژوهش - متخصص تطوير الأعمال وتوسيع السوق. 14+ سنة من الخبرة في المبيعات والتسويق وتطوير الأعمال.">
    <meta name="author" content="محمد پژوهش">
    <title>محمد پژوهش - السيرة الذاتية الاحترافية</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/print.css">
    
    <!-- Arabic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Scheherazade New', 'Arabic Typesetting', Arial, sans-serif;
        }
    </style>
    
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <div class="language-switcher">
            <button class="language-btn" data-lang="en">🇺🇸 English</button>
            <button class="language-btn" data-lang="de">🇩🇪 Deutsch</button>
            <button class="language-btn active" data-lang="ar">🇸🇦 العربية</button>
            <button class="language-btn" data-lang="fa">🇮🇷 فارسی</button>
        </div>
        <div class="export-buttons">            <button id="themeToggle" class="theme-toggle-btn" type="button">☀️ فاتح</button>            <button id="exportPdf" class="export-btn">📥 تحميل PDF</button>
            <button id="printResume" class="export-btn">🖨️ طباعة</button>
        </div>
    </div>

    <div class="container">
        <!-- Header will be injected by JavaScript -->
        <div class="content">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <!-- Main Application Logic -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
