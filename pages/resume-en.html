<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mohammad Pazhoohesh - Business Development & Market Expansion Specialist. 14+ years of experience in sales, marketing, and business development.">
    <meta name="author" content="Mohammad Pazhoohesh">
    <title>Mohammad Pazhoohesh - Professional Resume</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/print.css">
    
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <div class="language-switcher">
            <button class="language-btn active" data-lang="en">🇺🇸 English</button>
            <button class="language-btn" data-lang="de">🇩🇪 Deutsch</button>
            <button class="language-btn" data-lang="ar">🇸🇦 العربية</button>
            <button class="language-btn" data-lang="fa">🇮🇷 فارسی</button>
        </div>
        <div class="export-buttons">
            <button id="themeToggle" class="theme-toggle-btn" type="button">☀️ Light</button>
            <button id="exportPdf" class="export-btn">📥 Download PDF</button>
            <button id="printResume" class="export-btn">🖨️ Print</button>
        </div>
    </div>

    <div class="container">
        <!-- Header will be injected by JavaScript -->
        <div class="content">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <!-- Main Application Logic -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
