<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Pazhoohesh - Resume</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loader {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        
        .loader h1 {
            margin: 0 0 20px 0;
            color: #333;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="loader">
        <h1>Loading Your Resume</h1>
        <div class="spinner"></div>
        <p class="message">Detecting your language...</p>
    </div>
    
    <script>
        // Get user's country from IP using ipapi.co (free, no key required)
        // Or use a simple fallback method
        
        async function detectLanguageAndRedirect() {
            try {
                // Try to detect language from browser
                const browserLang = navigator.language || navigator.userLanguage;
                
                // Try to get location from IP
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                const country = data.country_code || '';
                
                let targetLang = 'en'; // default
                
                // Determine language based on country or browser preference
                if (country === 'DE' || browserLang.startsWith('de')) {
                    targetLang = 'de';
                } else if (country === 'SA' || country === 'AE' || country === 'IR' || browserLang.startsWith('ar')) {
                    targetLang = 'ar';
                } else if (country === 'IR' || browserLang.includes('fa') || browserLang.includes('fa-IR')) {
                    targetLang = 'en'; // Default to English for Iran (can support Farsi later)
                }
                
                // Redirect to appropriate resume
                window.location.href = `pages/resume-${targetLang}.html`;
            } catch (error) {
                // Fallback to English if detection fails
                console.log('Language detection failed, using English');
                window.location.href = 'pages/resume-en.html';
            }
        }
        
        // Start detection after a short delay
        setTimeout(detectLanguageAndRedirect, 500);
    </script>
</body>
</html>
