<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="محمد پژوهش - متخصص توسعه کسب‌وکار و گسترش بازار. بیش از ۱۴ سال تجربه در فروش، بازاریابی و توسعه کسب‌وکار.">
    <meta name="author" content="محمد پژوهش">
    <title>محمد پژوهش - رزومه حرفه‌ای</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/print.css">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <div class="language-switcher">
            <button class="language-btn" data-lang="en">🇺🇸 English</button>
            <button class="language-btn" data-lang="de">🇩🇪 Deutsch</button>
            <button class="language-btn" data-lang="ar">🇸🇦 العربية</button>
            <button class="language-btn active" data-lang="fa">🇮🇷 فارسی</button>
        </div>
        <div class="export-buttons">
            <button id="themeToggle" class="theme-toggle-btn" type="button">☀️ روشن</button>
            <button id="exportPdf" class="export-btn">📥 دانلود PDF</button>
            <button id="printResume" class="export-btn">🖨️ چاپ</button>
        </div>
    </div>

    <div class="container">
        <div class="content">
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
